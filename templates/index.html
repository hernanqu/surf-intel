<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Surf Intel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #000000;
            --text: #f5f5f5;
            --muted: #6d6d6d;
            --divider: #262626;
            --accent: #666666;
        }

        body.status-go {
            --accent: #874cff;
        }

        body.status-no-go {
            --accent: #4c8dff;
        }

        body.status-yewww {
            --accent: #3f8cff;
        }

        body.status-dangerous {
            --accent: #ff2b2b;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--background);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            padding: 34px 28px 56px;
        }

        .header {
            width: min(680px, 100%);
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .menu {
            border: 0;
            padding: 4px 0;
            background: transparent;
            color: var(--accent);

            font-size: 22px;
            line-height: 1;
            font-weight: 400;

            cursor: default;
        }

        .main {
            width: min(680px, 100%);
            margin: 0 auto;
        }

        .intel {
            width: 100%;
            padding-top: clamp(42px, 6vh, 70px);
            text-align: center;
        }

        .status {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(120px, 20vw, 220px);
            line-height: 0.85;
            font-weight: 700;
            letter-spacing: -0.075em;

            color: var(--accent);
        }

        .status.no-go {
            font-size: clamp(82px, 14vw, 160px);
            letter-spacing: -0.065em;
        }

        .status.yewww {
            font-size: clamp(64px, 11vw, 110px);
            letter-spacing: -0.06em;
        }

        .status.dangerous {
            font-size: clamp(54px, 9vw, 92px);
            letter-spacing: -0.055em;
        }

        .status.loading,
        .status.error {
            color: var(--muted);
        }

        .window {
            margin-top: 28px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;

            color: var(--accent);
        }

        .location {
            margin-top: 20px;

            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        .location-time {
            color: var(--accent);
        }

        .reason {
            width: min(520px, 100%);
            margin: 12px auto 0;

            font-size: 12px;
            font-weight: 600;
            line-height: 1.55;
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        .conditions.night {
            opacity: 0.35;
        }

        .night-muted {
            opacity: 0.35;
        }

        .conditions {
            width: min(440px, 100%);
            margin: 34px auto 0;

            border-top: 1px solid var(--divider);
        }

        .condition {
            min-height: 50px;

            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;

            border-bottom: 1px solid var(--divider);

            text-align: left;
        }

        .condition-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .condition-value {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            text-align: right;

            color: var(--accent);
        }

        .refresh-button {
            margin-top: 20px;
            padding: 10px 18px;

            border: 0;
            background: transparent;
            color: var(--accent);

            font-size: 17px;
            line-height: 1;
            cursor: pointer;
        }

        .refresh-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        @media (max-width: 700px) {
            .page {
                padding: 28px 22px 42px;
            }

            .brand {
                font-size: 10px;
            }

            .menu {
                font-size: 20px;
            }

            .intel {
                padding-top: 78px;
            }

            .status {
                font-size: clamp(125px, 43vw, 220px);
            }

            .status.no-go {
                font-size: clamp(78px, 28vw, 150px);
            }

            .status.yewww {
                font-size: clamp(56px, 17vw, 84px);
            }

            .status.dangerous {
                font-size: clamp(46px, 14vw, 72px);
            }

            .window {
                margin-top: 24px;
                font-size: 11px;
            }

            .location {
                margin-top: 28px;
                font-size: 12px;
            }

            .reason {
                margin-top: 10px;
                width: min(340px, 100%);

                font-size: 11px;
                line-height: 1.5;
            }

            .conditions {
                margin-top: 42px;
            }

            .condition {
                min-height: 54px;
                gap: 18px;
            }

            .condition-label {
                font-size: 10px;
            }

            .condition-value {
                font-size: 12px;
            }

            .refresh-button {
                margin-top: 26px;
            }
        }
    </style>
</head>

<body>
<div class="page">

    <header class="header">

        <button
            class="menu"
            type="button"
            aria-label="Menu"
            tabindex="-1"
        >
            ☰
        </button>
    </header>

    <main class="main">
        <section class="intel">

            <div
                id="status"
                class="status loading"
            >
                ...
            </div>

            <div
                id="window"
                class="window"
            >
                WINDOW: --
            </div>

            <div
                id="location"
                class="location"
                data-spot="{{ spot.name }}"
            >
                <span id="locationName">
                    {{ spot.name }}
                </span>

                <span
                    id="locationTime"
                    class="location-time"
                >
                </span>
            </div>

            <div
                id="reason"
                class="reason"
            >
                Checking conditions...
            </div>

            <div class="conditions">

                <div class="condition">
                    <div class="condition-label">
                        WAVES
                    </div>

                    <div
                        id="waveHeight"
                        class="condition-value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="condition-label">
                        PERIOD
                    </div>

                    <div
                        id="wavePeriod"
                        class="condition-value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="condition-label">
                        DIRECTION
                    </div>

                    <div
                        id="waveDirection"
                        class="condition-value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="condition-label">
                        WIND
                    </div>

                    <div class="condition-value">
                        <span id="windCondition">--</span>
                        <span id="windDetails">--</span>
                    </div>
                </div>

                <div class="condition">
                    <div class="condition-label">
                        TIDE
                    </div>

                    <div
                        id="tide"
                        class="condition-value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="condition-label">
                        WATER
                    </div>

                    <div
                        id="waterTemp"
                        class="condition-value"
                    >
                        --
                    </div>
                </div>

            </div>

            <button
                id="refreshButton"
                class="refresh-button"
                type="button"
                aria-label="Refresh conditions"
                title="Refresh conditions"
            >
                ↻
            </button>

        </section>
    </main>

</div>

<script>
async function loadSurfData(forceRefresh = false) {

    try {
        const endpoint = forceRefresh
            ? "/api/marine?refresh=1"
            : "/api/marine";

        const response = await fetch(endpoint);

        if (!response.ok) {
            throw new Error(
                "Marine API returned " + response.status
            );
        }

        const data = await response.json();
        const assessment = data.assessment;

        const conditionsEl =
            document.querySelector(".conditions");

        const locationEl =
            document.getElementById("location");

        if (
            conditionsEl &&
            data.current &&
            data.current.is_day === 0
        ) {
            conditionsEl.classList.add("night");
        } else if (conditionsEl) {
            conditionsEl.classList.remove("night");
        }

        const statusElement =
            document.getElementById("status");

        const status =
            assessment.status || "ERROR";

        statusElement.textContent = status;

        document.body.classList.remove(
            "status-go",
            "status-no-go",
            "status-yewww",
            "status-dangerous"
        );

        if (status === "YEW!") {
            statusElement.className = "status yewww";
            document.body.classList.add("status-yewww");
        } else if (status === "MID") {
            statusElement.className = "status no-go";
            document.body.classList.add("status-no-go");
        } else if (status === "NAH") {
            statusElement.className = "status dangerous";
            document.body.classList.add("status-dangerous");
        } else {
            statusElement.className = "status error";
        }

        const isNight =
            data.current &&
            data.current.is_day === 0;

        if (isNight) {
            statusElement.classList.add("night-muted");
            locationEl.classList.add("night-muted");
        } else {
            statusElement.classList.remove("night-muted");
            locationEl.classList.remove("night-muted");
        }


        const windowEl =
            document.getElementById("window");

        if (
            (status === "YEW!" || status === "MID") &&
            data.window
        ) {
            windowEl.textContent =
                "WINDOW: " + data.window;

            windowEl.style.display = "";

        } else {
            windowEl.style.display = "none";
        }


        document.getElementById("tide").textContent =
            data.tide &&
            data.tide.height_ft != null &&
            data.tide.direction
                ? data.tide.height_ft +
                  " FT " +
                  data.tide.direction
                : "--";


        document.getElementById("reason").textContent =
            assessment.reason ===
                "It's dark. Check back after dawn."
                ? data.dawn_forecast
                    ? "DAWN PATROL: " +
                      data.dawn_forecast.time +
                      " · " +
                      data.dawn_forecast.outlook +
                      " · " +
                      data.dawn_forecast.assessment.wave_height_range +
                      " · " +
                      data.dawn_forecast.assessment.wind_label +
                      " " +
                      data.dawn_forecast.assessment.wind_speed_kt +
                      " KT " +
                      data.dawn_forecast.assessment.wind_compass +
                      ". Hasta mañana."
                    : data.dawn_patrol
                        ? "It's dark. Dawn patrol: " +
                          data.dawn_patrol +
                          ". Hasta mañana."
                        : assessment.reason
                : assessment.reason ||
                  "Conditions unavailable.";


        document.getElementById("waveHeight").textContent =
            assessment.wave_height_range != null
                ? assessment.wave_height_range
                : "--";


        document.getElementById("wavePeriod").textContent =
            assessment.swell_period_s != null
                ? assessment.swell_period_s +
                  " SEC"
                : "--";


        document.getElementById("waveDirection").textContent =
            assessment.swell_direction != null
                ? assessment.swell_compass +
                  " " +
                  assessment.swell_direction +
                  "°"
                : "--";


        document.getElementById("windCondition").textContent =
            assessment.wind_label &&
            assessment.wind_label !== "UNKNOWN"
                ? assessment.wind_label
                : "--";


        document.getElementById("windDetails").textContent =
            assessment.wind_speed_kt != null
                ? assessment.wind_speed_kt +
                  " KT " +
                  assessment.wind_compass
                : "--";


        document.getElementById("waterTemp").textContent =
            data.water_temperature_f != null
                ? data.water_temperature_f +
                  "°F"
                : "--";

    } catch (error) {

        console.error(error);

        const statusElement =
            document.getElementById("status");

        statusElement.textContent = "ERROR";
        statusElement.className = "status error";

        document.getElementById("reason").textContent =
            "Unable to retrieve current conditions.";
    }
}


function updateLocationTime() {

    const locationElement =
        document.getElementById("location");

    const locationNameElement =
        document.getElementById("locationName");

    const locationTimeElement =
        document.getElementById("locationTime");

    const spotName =
        locationElement.dataset.spot;

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: "America/Los_Angeles",
                hour: "numeric",
                minute: "2-digit"
            }
        );

    const time =
        formatter.format(new Date());

    locationNameElement.textContent =
        spotName.toUpperCase();

    locationTimeElement.textContent =
        " " + time;
}


updateLocationTime();

setInterval(
    updateLocationTime,
    60000
);


const refreshButton =
    document.getElementById("refreshButton");


refreshButton.addEventListener(
    "click",
    async () => {

        refreshButton.disabled = true;
        refreshButton.textContent = "…";

        await loadSurfData(true);

        updateLocationTime();

        refreshButton.textContent = "↻";

        setTimeout(() => {
            refreshButton.disabled = false;
        }, 30000);
    }
);


loadSurfData();
</script>

</body>
</html>
