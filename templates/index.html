<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Surf Intel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #000;
            color: #f5f5f5;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 48px 64px 40px;
        }

        .brand {
            position: absolute;
            top: 48px;
            left: 64px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intel {
            width: min(680px, 100%);
            text-align: center;
            transform: translateY(-1vh);
        }

        .status {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(150px, 27vw, 310px);
            line-height: 0.72;
            font-weight: 700;
            letter-spacing: -0.10em;
            transform: translateX(-0.04em);
        }

        .status.go {
            color: #874cff;
        }

        .status.no-go {
            color: #ff5252;
            font-size: clamp(92px, 18vw, 210px);
            letter-spacing: -0.08em;
        }

        .status.loading,
        .status.error {
            color: #555;
        }

        .location {
            margin-top: 48px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.01em;
        }

        .location-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .refresh-button {
            margin-top: 48px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #888;
            font-size: 10px;
            line-height: 1;
            font-weight: 400;
            cursor: pointer;
        }

        .refresh-button:disabled {
            opacity: 1;
            cursor: pointer;
        }

        .reason {
            max-width: 540px;
            margin: 42px auto 0;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.55;
            text-transform: uppercase;
        }

        .conditions {
            margin: 48px auto 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .condition {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.05;
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .value {
            margin-top: 2px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .subvalue {
            margin-top: 2px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .footer {
            position: absolute;
            right: 64px;
            bottom: 38px;
            font-size: 12px;
            font-weight: 400;
        }

        @media (max-width: 700px) {
            .page {
                padding: 30px 22px 28px;
            }

            .brand {
                top: 30px;
                left: 22px;
                font-size: 10px;
            }

            .intel {
                transform: translateY(1vh);
            }

            .status {
                font-size: clamp(125px, 43vw, 220px);
            }

            .status.no-go {
                font-size: clamp(78px, 28vw, 150px);
            }

            .location {
                margin-top: 38px;
                font-size: 13px;
            }

            .reason {
                margin-top: 32px;
                max-width: 330px;
                font-size: 11px;
            }

            .conditions {
                margin-top: 38px;
                gap: 15px;
            }

            .label {
                font-size: 10px;
            }

            .value {
                font-size: 12px;
            }

            .subvalue {
                font-size: 11px;
            }

            .footer {
                right: 22px;
                bottom: 22px;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">
        Surf Intel
    </div>

    <main class="main">

        <section class="intel">

            <div
                id="status"
                class="status loading"
            >
                ...
            </div>

            <div class="location-row">
                <div
                    id="location"
                    class="location"
                    data-spot="{{ spot.name }}"
                >
                    {{ spot.name }}
                </div>

                <button
                    id="refreshButton"
                    class="refresh-button"
                    type="button"
                    aria-label="Refresh conditions"
                    title="Refresh conditions"
                >
                    ↻
                </button>
            </div>

            <div
                id="reason"
                class="reason"
            >
                Checking conditions...
            </div>

            <div class="conditions">

                <div class="condition">
                    <div class="label">
                        Wave Height
                    </div>

                    <div
                        id="waveHeight"
                        class="value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="label">
                        Period
                    </div>

                    <div
                        id="wavePeriod"
                        class="value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="label">
                        Direction
                    </div>

                    <div
                        id="waveDirection"
                        class="value"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="label">
                        Wind
                    </div>

                    <div
                        id="windCondition"
                        class="value"
                    >
                        --
                    </div>

                    <div
                        id="windDetails"
                        class="subvalue"
                    >
                        --
                    </div>
                </div>

                <div class="condition">
                    <div class="label">
                        Water
                    </div>

                    <div
                        id="waterTemp"
                        class="value"
                    >
                        --
                    </div>
                </div>

            </div>

        </section>

    </main>

    <div class="footer">
        2026
    </div>

</div>

<script>
async function loadSurfData(forceRefresh = false) {
    try {
        const endpoint = forceRefresh
            ? "/api/marine?refresh=1"
            : "/api/marine";

        const response = await fetch(endpoint);

        if (!response.ok) {
            throw new Error(
                "Marine API returned " + response.status
            );
        }

        const data = await response.json();
        const assessment = data.assessment;

        const statusElement =
            document.getElementById("status");

        const status =
            assessment.status || "ERROR";

        statusElement.textContent = status;

        if (status === "GO") {
            statusElement.className = "status go";
        } else if (status === "NO-GO") {
            statusElement.className = "status no-go";
        } else {
            statusElement.className = "status error";
        }

        document.getElementById("reason").textContent =
            assessment.reason ||
            "Conditions unavailable.";

        document.getElementById("waveHeight").textContent =
            assessment.wave_height_ft != null
                ? assessment.wave_height_ft + " FT"
                : "--";

        document.getElementById("wavePeriod").textContent =
            assessment.wave_period_s != null
                ? assessment.wave_period_s + " SEC"
                : "--";

        document.getElementById("waveDirection").textContent =
            assessment.wave_direction != null
                ? assessment.wave_compass +
                  " " +
                  assessment.wave_direction +
                  "°"
                : "--";

        document.getElementById("windCondition").textContent =
            assessment.wind_label &&
            assessment.wind_label !== "UNKNOWN"
                ? assessment.wind_label
                : "--";

        document.getElementById("windDetails").textContent =
            assessment.wind_speed_kt != null
                ? assessment.wind_speed_kt +
                  " KT " +
                  assessment.wind_compass
                : "--";

        document.getElementById("waterTemp").textContent =
            data.water_temperature_f != null
                ? data.water_temperature_f + "°F"
                : "--";

    } catch (error) {
        console.error(error);

        const statusElement =
            document.getElementById("status");

        statusElement.textContent = "ERROR";
        statusElement.className = "status error";

        document.getElementById("reason").textContent =
            "Unable to retrieve current conditions.";
    }
}

function updateLocationTime() {
    const locationElement =
        document.getElementById("location");

    const spotName =
        locationElement.dataset.spot;

    const formatter = new Intl.DateTimeFormat(
        "en-US",
        {
            timeZone: "America/Los_Angeles",
            hour: "numeric",
            minute: "2-digit"
        }
    );

    const time = formatter.format(new Date());

    locationElement.textContent =
        spotName.toUpperCase() + " " + time;
}

updateLocationTime();
setInterval(updateLocationTime, 60000);

const refreshButton =
    document.getElementById("refreshButton");

refreshButton.addEventListener("click", async () => {
    refreshButton.disabled = true;
    refreshButton.textContent = "…";

    await loadSurfData(true);

    updateLocationTime();

    refreshButton.textContent = "↻";

    setTimeout(() => {
        refreshButton.disabled = false;
    }, 30000);
});

loadSurfData();
</script>

</body>
</html>
