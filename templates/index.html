<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Surf Intel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0f14;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .header {
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #6b7280;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 6px 0;
            font-size: 38px;
            letter-spacing: -1px;
        }

        .location {
            color: #9ca3af;
            font-size: 16px;
        }

        .verdict {
            border: 1px solid #26303b;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            background: #11161d;
        }

        .verdict-label {
            color: #6b7280;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status {
            font-size: 64px;
            font-weight: 800;
            margin: 8px 0 12px;
            letter-spacing: -2px;
        }

        .status.go {
            color: #4ade80;
        }

        .status.caution {
            color: #facc15;
        }

        .status.no-go {
            color: #f87171;
        }

        .reason {
            color: #b8c0cc;
            max-width: 700px;
            font-size: 17px;
            line-height: 1.5;
        }

        .board {
            margin-top: 22px;
            color: #6b7280;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .card {
            background: #11161d;
            border: 1px solid #26303b;
            border-radius: 12px;
            padding: 22px;
        }

        .label {
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 27px;
            font-weight: 700;
            margin-top: 9px;
        }

        .unit {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 400;
        }

        .loading {
            color: #6b7280;
        }

        @media (max-width: 800px) {

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .container {
                padding: 24px 16px;
            }

            h1 {
                font-size: 30px;
            }

            .status {
                font-size: 48px;
            }

            .grid {
                grid-template-columns: 1fr 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="eyebrow">
            Surf Intelligence
        </div>

        <h1>Surf Intel</h1>

        <div class="location">
            {{ spot.name }}
        </div>

    </div>


    <div class="verdict">

        <div class="verdict-label">
            Session Assessment
        </div>

        <div
            id="status"
            class="status loading"
        >
            LOADING
        </div>

        <div
            id="reason"
            class="reason"
        >
            Analyzing current marine conditions...
        </div>

        <div class="board">
            Profile: 6'8" Haydenshape Hypto Krypto Softboard
        </div>

    </div>


    <div class="grid">

        <div class="card">

            <div class="label">
                Wave Height
            </div>

            <div
                id="waveHeight"
                class="value"
            >
                --
            </div>

        </div>


        <div class="card">

            <div class="label">
                Period
            </div>

            <div
                id="wavePeriod"
                class="value"
            >
                --
            </div>

        </div>


        <div class="card">

            <div class="label">
                Direction
            </div>

            <div
                id="waveDirection"
                class="value"
            >
                --
            </div>

        </div>


        <div class="card">

            <div class="label">

                Wind

            </div>

            <div
                id="windCondition"
                class="value"
            >
                --
            </div>

            <div
                id="windDetails"
                class="unit"
            >
                --
            </div>

        </div>

        <div class="card">

            <div class="label">
                Water
            </div>

            <div
                id="waterTemp"
                class="value"
            >
                --
            </div>

        </div>

    </div>

</div>


<script>

async function loadSurfData() {

    try {

        const response = await fetch("/api/marine");

        const data = await response.json();

        const assessment = data.assessment;

        const statusElement =
            document.getElementById("status");

        statusElement.textContent =
            assessment.status;

        statusElement.className =
            "status " +
            assessment.status.toLowerCase().replace("-", "");

        document.getElementById("reason").textContent =
            assessment.reason;

        document.getElementById("waveHeight").innerHTML =
            assessment.wave_height_ft +
            ' <span class="unit">ft</span>';

        document.getElementById("wavePeriod").innerHTML =
            assessment.wave_period_s +
            ' <span class="unit">sec</span>';

        document.getElementById("waveDirection").innerHTML =
            assessment.wave_compass +
            ' <span class="unit">' +
            assessment.wave_direction +
            '°</span>';
document.getElementById("windCondition").textContent =
    assessment.wind_label;

document.getElementById("windDetails").textContent =
    assessment.wind_speed_kt +
    " kt " +
    assessment.wind_compass;
        document.getElementById("waterTemp").innerHTML =
            data.water_temperature_f +
            ' <span class="unit">°F</span>';

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "ERROR";

        document.getElementById("reason").textContent =
            "Unable to retrieve marine conditions.";

    }

}

loadSurfData();

</script>

</body>

</html>
